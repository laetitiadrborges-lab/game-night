/* ---------- construction de la soirée ---------- */
function selModes(){try{var a=JSON.parse(sessionStorage.getItem("gm"+code));if(a)return a}catch(e){}return MODES.slice()}
function launch(){
 var ids=plIds(),sel=selModes(),steps=[],np=ids.length;
 function ix(x,i){return i}
 MODES.forEach(function(m){
  if(sel.indexOf(m)<0)return;
  steps.push({t:"intro",m:m});
  if(m==="tr"){sh(GN.tr.map(ix)).forEach(function(i){var p=sh(ids),n=p.length,o={t:"tr",i:i,acc:p[0],vic:p[1]};
   if(n>=5){o.av1=p[2];o.av2=p[3];o.jury=p.slice(4)}else o.jury=p.slice(2);steps.push(o)})}
  else if(m==="wr"){var k=steps.length;steps.push({t:"wc",p:rnd(GN.wc.length)});for(var j=0;j<np;j++)steps.push({t:"wr",c:k,f:0})}
  else if(m==="tx"){sh(GN.tx.map(ix)).slice(0,2).forEach(function(p){var k=steps.length;steps.push({t:"tc",p:p});steps.push({t:"tv",c:k,p:p,f:0})})}
  else if(m==="kn"){var per=np<=4?3:np<=6?2:1,pool=sh(GN.kq.map(ix)),q=0;sh(ids).forEach(function(id){for(var j=0;j<per;j++)steps.push({t:"kn",s:id,i:pool[q++%pool.length]})});steps.push({t:"ksc"})}
  else sh(GN[m].map(ix)).forEach(function(i){steps.push({t:m,i:i})})});
 T.set(room()+"/steps",steps).then(function(){return ctl({phase:"play",step:0,rev:false})})
}
function nxt(o){for(var i=o.n+1;i<o.st.length;i++){if(!o.st[i].skip)return i}return -1}
function prv(o){for(var i=o.n-1;i>=0;i--){if(!o.st[i].skip)return i}return -1}
function advance(o){
 var st=o.st.slice(),n=o.n,s=o.s,p=Promise.resolve();
 if(s&&(s.t==="wc"||s.t==="tc")&&st[n+1]&&st[n+1].c===n&&!st[n+1].f){
  var vs=votes(n),au=Object.keys(vs).filter(function(id){return String(vs[id]||"").trim()});
  if(s.t==="wc"){var a=sh(au);for(var j=0;st[n+1+j]&&st[n+1+j].c===n;j++){st[n+1+j]=j<a.length?{t:"wr",a:a[j],c:n,p:s.p,f:1}:{t:"wr",c:n,skip:1,f:1}}}
  else st[n+1]=au.length>=2?{t:"tv",c:n,p:s.p,o:sh(au),f:1}:{t:"tv",c:n,skip:1,f:1};
  p=T.set(room()+"/steps",st)}
 return p.then(function(){var i=n+1;while(st[i]&&st[i].skip)i++;if(!st[i])return ctl({phase:"end"});return ctl({step:i,rev:false})})
}
function knScores(){var sc={};plIds().forEach(function(id){sc[id]=0});(dig(S,["steps"])||[]).forEach(function(s,k){if(s.t!=="kn")return;var vs=votes(k),a=vs[s.s];if(a==null)return;Object.keys(vs).forEach(function(id){if(id!==s.s&&vs[id]===a)sc[id]=(sc[id]||0)+1})});return sc}
function stepOf(){var st=dig(S,["steps"])||[],n=dig(S,["ctl","step"])||0;return {st:st,n:n,s:st[n]}}
function role(o,id){if(o.acc===id)return "acc";if(o.vic===id)return "vic";if(o.av1===id)return "av1";if(o.av2===id)return "av2";return "jury"}

function bar(cls,label,k,tot,top){return '<div class="bar '+cls+(top?' top':'')+'"><span>'+label+'</span><i style="width:'+(tot?Math.max(2,Math.round(k/tot*100)):0)+'%"></i><strong>'+k+'</strong></div>'}

 else if(s.t==="wr"){

 else if(s.t==="kn"){

 else if(s.t==="tv"){
  var od=s.o||[],cs=votes(s.c),it=od.slice().sort(function(a,b){return (c[b]||0)-(c[a]||0)}),mt=c[it[0]]||0;
  h+=it.map(function(a){var k=c[a]||0,fr=Object.keys(vs).filter(function(x){return vs[x]===a});return '<div class="paper" style="margin:8px 0'+(k===mt&&k>0?';box-shadow:0 0 0 3px #ff4d8d,0 10px 30px #0008':'')+'"><strong>'+esc(cs[a]||"")+'</strong><div style="font-size:.7em;margin-top:6px;color:#8a3a5a">'+pn(a)+' · '+k+' vote'+(k>1?'s':'')+(fr.length?' ← '+names(fr):'')+'</div></div>'}).join("");
  if(mt>0)h+='<p class="hand">Le pire texto de la soirée : '+names(it.filter(function(a){return (c[a]||0)===mt}))+'</p>'}
 else if(s.t==="tr"){

 if(!me){
  if(ph!=="lobby"){$("app").innerHTML='<h2>Partie déjà lancée</h2><p>Demande à l’animatrice de créer une nouvelle partie.</p>';return}
  $("app").innerHTML='<div class="eb">Girls Night</div><h2>Rejoindre '+esc(code)+'</h2><p>Entre ton prénom.</p><input type="text" id="nm" maxlength="20" placeholder="Ton prénom" autocomplete="given-name"><button class="btn" id="jn">Rejoindre</button>';
  $("jn").onclick=function(){var n=$("nm").value.trim();if(n)T.set(room()+"/players/"+pid,{n:n}).then(function(){last=null;tick()})};return}
 var h='<div class="eb">Girls Night · '+esc(me.n)+'</div>';
 if(ph==="lobby")h+='<h2>Tu es dans la partie</h2><p>Regarde l’écran : on va bientôt commencer.</p>';
 else if(ph==="end")h+='<h2>Merci d’avoir joué</h2><p class="hand">Aucun jugement… enfin, presque.</p>';
 else{
  var o=stepOf(),s=o.s;if(!s){$("app").innerHTML=h;return}
  var rev=!!S.ctl.rev,mine=votes(o.n)[pid];
  h+=stepHtml(s,o.n,false);
  if(s.t==="tr"){var r=role(s,pid);h+='<div class="card"><h3>Ton rôle : '+ROLE_TXT[r][0]+'</h3><p>'+ROLE_TXT[r][1]+'</p></div>'}
  var canVote=s.t!=="intro"&&s.t!=="ksc"&&s.t!=="wc"&&s.t!=="tc"&&(s.t!=="tr"||role(s,pid)==="jury")&&!(s.t==="wr"&&s.a===pid);
  if(s.t==="intro"||s.t==="ksc")h+='<p class="hand">Regarde l’écran.</p>';
  else if(s.t==="wr"&&s.a===pid&&!rev)h+='<div class="card"><strong>C’est ta confession !</strong> Garde ton air innocent…</div>';
  else if(s.t==="wc"||s.t==="tc"){var dv=DR[o.n]!=null?DR[o.n]:(mine||"");
   h+='<textarea id="tx" maxlength="'+(s.t==="wc"?160:200)+'" rows="4" placeholder="Écris ici…">'+esc(dv)+'</textarea><button class="btn" id="ts">'+(mine?"Modifier":"Envoyer")+'</button>'+(mine?'<p class="hand">Envoyé ✓ Tu peux encore le modifier.</p>':'')}
  else if(canVote&&!rev){
   if(mine)h+='<div class="card"><strong>Vote enregistré.</strong> Attends la révélation.</div>';
   if(s.t==="km"){
    var ks=KS[o.n]||(KS[o.n]=["","",""]),cur=mine?mine.split(""):ks;
    h+=mine?'':'<h3>Attribue Kiss, Marry et Kill</h3>';
    if(!mine)h+=GN.km[s.i].map(function(x,j){return '<div class="card"><strong>'+esc(x)+'</strong><div>'+KA.map(function(a){return '<button class="btn sm '+(ks[j]===a?'':'alt')+' ka" data-o="'+j+'" data-a="'+a+'">'+KN[a]+'</button>'}).join("")+'</div></div>'}).join("")+'<button class="btn" id="kv"'+(ks.every(Boolean)?'':' disabled')+'>Valider</button>';
    else h+=GN.km[s.i].map(function(x,j){return '<p><strong>'+KN[cur[j]]+' :</strong> '+esc(x)+'</p>'}).join("")}
   else{
    if(!mine)h+='<h3>'+(s.t==="rf"?"Ton vote":s.t==="yn"?"Ta réponse":s.t==="su"?"Qui est la plus susceptible ?":s.t==="wr"?"Qui a écrit ça ?":s.t==="kn"?(pid===s.s?"Réponds pour toi":"Que va répondre "+pnr(s.s)+" ?"):s.t==="tv"?"Vote pour le pire texto":"Ton verdict")+'</h3>';
    var opts=s.t==="rf"?RF_OPT.map(function(o){return [o[0],o[1],o[0]==="g"?"g":"r"]}):s.t==="yn"?YN_OPT.map(function(o){return [o[0],o[1],o[0]==="o"?"g":"r"]}):s.t==="su"?plIds().map(function(id){return [id,pnr(id),""]}):s.t==="wr"?plIds().filter(function(i){return i!==s.a}).map(function(id){return [id,pnr(id),""]}):s.t==="kn"?GN.kq[s.i].o.map(function(t,j){return [String(j),String.fromCharCode(65+j)+". "+t,""]}):s.t==="tv"?(s.o||[]).filter(function(a){return a!==pid}).map(function(a){return [a,String.fromCharCode(65+(s.o||[]).indexOf(a))+". "+(votes(s.c)[a]||""),""]}):[["c","Coupable","r"],["i","Innocente","g"]];
    h+=opts.map(function(o){return '<button class="vb '+o[2]+(mine===o[0]?' sel':'')+'" data-v="'+esc(o[0])+'"'+(mine?' disabled':'')+'>'+esc(o[1])+'</button>'}).join("")}}
  else if(s.t==="tr"&&!canVote&&!rev)h+='<p class="hand">Le jury va voter après vos plaidoiries.</p>'
 }
 $("app").innerHTML=h;
 Array.prototype.forEach.call(document.querySelectorAll(".vb"),function(b){b.onclick=function(){var o=stepOf();T.set("votes/"+code+"/"+o.n+"/"+pid,b.getAttribute("data-v")).then(function(){last=null;tick()})}});
 Array.prototype.forEach.call(document.querySelectorAll(".ka"),function(b){b.onclick=function(){var o=stepOf(),ks=KS[o.n],j=+b.getAttribute("data-o"),a=b.getAttribute("data-a"),old=ks[j];
  if(ks[j]===a){ks[j]=""}else{for(var k=0;k<3;k++)if(ks[k]===a)ks[k]=old;ks[j]=a}playerView()}});
 if($("kv"))$("kv").onclick=function(){var o=stepOf();T.set("votes/"+code+"/"+o.n+"/"+pid,KS[o.n].join("")).then(function(){last=null;tick()})};
 if($("tx"))$("tx").oninput=function(){DR[stepOf().n]=this.value};
 if($("ts"))$("ts").onclick=function(){var o=stepOf(),v=$("tx").value.trim();if(!v)return;DR[o.n]=v;T.set("votes/"+code+"/"+o.n+"/"+pid,v).then(function(){last=null;tick()})}
}

/* ---------- animatrice ---------- */
function hostView(){
 var ph=dig(S,["ctl","phase"])||"lobby",ids=plIds(),h="",tvUrl=location.origin+location.pathname+"?tv="+code;
 if(!S){$("app").innerHTML='<h2>Code introuvable</h2>';return}
 if(ph==="lobby"){
  var sel=selModes();
  h='<div class="eb">Console animatrice</div><h1>Salon '+code+'</h1><p>Chaque joueuse scanne le QR code de la télé (ou tape le code) et entre son prénom.</p><div class="big">'+code+'</div>'+qrFor(location.origin+location.pathname+"#"+code,4)+'<h3 style="margin-top:14px">Joueuses ('+ids.length+')</h3><div class="chips">'+(ids.length?ids.map(function(i){return '<span class="chip">'+pn(i)+'</span>'}).join(""):'<span style="color:var(--mut)">En attente…</span>')+'</div><div class="card"><strong>Jeux de la soirée</strong>'+MODES.map(function(m){return '<label style="display:block;margin:8px 0"><input type="checkbox" class="gm" data-m="'+m+'" '+(sel.indexOf(m)>-1?"checked":"")+' style="margin-right:8px">'+GN.M[m].n+'</label>'}).join("")+'<p style="color:var(--mut);font-size:14px;margin:6px 0 0">En cours de soirée, tu pourras passer d’un jeu à l’autre quand tu veux.</p></div><div class="card"><strong>Lien de l’écran TV</strong><p style="word-break:break-all">'+tvUrl+'</p></div><button class="btn" id="go"'+(ids.length>=3&&ids.length<=12?'':' disabled')+'>Lancer la soirée</button><p style="color:var(--mut);font-size:14px">De 3 à 12 joueuses.</p>'+demoNote()}
 else if(ph==="play"){
  var o=stepOf(),s=o.s,rev=!!S.ctl.rev,vs=votes(o.n),vt=s?voters(s):[];
  var label=!s?"":s.t==="intro"?"Règles : "+GN.M[s.m].n:s.t==="tr"?"Tribunal : "+GN.tr[s.i].t:LBL[s.t]||GN.M[s.t].n;
  h='<div class="eb">Console animatrice · '+code+'</div><h2>Écran '+(o.n+1)+' / '+o.st.length+'</h2><div class="card"><strong>'+esc(label)+'</strong>'+(s&&(s.t==="rf"||s.t==="yn"||s.t==="su")?'<p>'+esc(GN[s.t][s.i])+'</p>':'')+(s&&s.t==="km"?'<ol>'+GN.km[s.i].map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol>':'')+(s&&s.t==="kn"?'<p>'+esc(GN.kq[s.i].q)+' — sur <strong>'+pn(s.s)+'</strong></p>':'')+(s&&s.t==="wr"?'<p>Auteure : <strong>'+pn(s.a)+'</strong> (secret !)</p>':'')+(s&&(s.t==="wc"||s.t==="tc")?'<p>'+esc(s.t==="wc"?GN.wc[s.p]:GN.tx[s.p])+'</p>':'')+(s&&s.t==="tr"?'<p>Accusée : <strong>'+pn(s.acc)+'</strong> · Victime : <strong>'+pn(s.vic)+'</strong>'+(s.av1?' · Avocates : '+pn(s.av1)+' (accusation), '+pn(s.av2)+' (défense)':'')+'</p><p style="color:var(--mut)">Accusation : '+esc(GN.tr[s.i].acc)+'</p>':'')+'</div>';
  if(s&&s.t!=="intro"&&s.t!=="ksc")h+='<div class="card"><strong>'+(s.t==="wc"||s.t==="tc"?"Textes reçus : ":"Votes : ")+''+Object.keys(vs).length+' / '+vt.length+'</strong><div class="chips">'+vt.map(function(id){return '<span class="chip" style="opacity:'+(vs[id]!=null?1:.4)+'">'+pn(id)+(vs[id]!=null?" ✓":"")+'</span>'}).join("")+'</div>'+(rev?resultHtml(s,o.n):"")+'</div>';
  h+='<button class="btn alt" id="pv"'+(prv(o)>=0?'':' disabled')+'>Précédent</button>'+(s&&NOREV.indexOf(s.t)<0&&!rev?'<button class="btn" id="rv">Révéler</button>':'')+(nxt(o)>=0?'<button class="btn" id="nx">Suivant</button>':'<button class="btn" id="fin">Terminer la soirée</button>');
  var intros=o.st.map(function(x,i){return x.t==="intro"?i:-1}).filter(function(i){return i>=0});
  h+='<div class="card" style="margin-top:16px"><strong>Changer de jeu</strong><p style="color:var(--mut);margin:4px 0">Quand elles en ont assez, passe directement à un autre jeu.</p>'+intros.map(function(i){var m=o.st[i].m;return '<button class="btn sm alt jmp" data-i="'+i+'">'+esc(GN.M[m].n)+'</button>'}).join("")+'</div>'}
 else h='<h2>Soirée terminée</h2><p>Merci d’avoir animé !</p>';
 $("app").innerHTML=h;
 Array.prototype.forEach.call(document.querySelectorAll(".gm"),function(c){c.onchange=function(){var a=[];Array.prototype.forEach.call(document.querySelectorAll(".gm"),function(x){if(x.checked)a.push(x.getAttribute("data-m"))});sessionStorage.setItem("gm"+code,JSON.stringify(a))}});
 if($("go"))$("go").onclick=launch;
 var o2=stepOf();
 if($("pv"))$("pv").onclick=function(){ctl({step:Math.max(0,prv(o2)),rev:false})};
 if($("nx"))$("nx").onclick=function(){advance(o2)};
 if($("rv"))$("rv").onclick=function(){ctl({rev:true})};
 if($("fin"))$("fin").onclick=function(){ctl({phase:"end"})};
 Array.prototype.forEach.call(document.querySelectorAll(".jmp"),function(b){b.onclick=function(){ctl({step:+b.getAttribute("data-i"),rev:false})}})
}

function view(){if(mode==="host")hostView();else if(mode==="tv")tvView();else if(mode==="player")playerView()}
window.addEventListener("hashchange",function(){location.reload()});
if(mode==="home")home();else if(mode==="pair")pairView();else tick();
</script>
</body>
</html>
